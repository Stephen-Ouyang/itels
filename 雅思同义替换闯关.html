<style>
:root{
  --bg:#f2f3f7; --card:#fff; --fg:#16181d; --muted:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --ok:#15803d; --okbg:#e8f7ee; --no:#b91c1c; --nobg:#fdeaea;
  --chip:#eef2ff; --radius:16px; --hl:#b45309; --hlbg:#fff7e6;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f1115; --card:#191c22; --fg:#e8eaee; --muted:#9aa1ad; --line:#2a2f38;
    --chip:#20242e; --okbg:#12291c; --nobg:#2a1616; --hl:#fbbf24; --hlbg:#2a2413;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);min-height:100vh;
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 40px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.2px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;
  box-shadow:0 6px 16px -6px rgba(37,99,235,.7);flex:0 0 34px}
.sub{color:var(--muted);font-size:12.5px;margin:0 2px 18px}

.mods{display:grid;gap:12px}
.mod{position:relative;background:var(--card);border-radius:var(--radius);padding:16px 16px 15px;
  box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;overflow:hidden;transition:transform .15s ease}
.mod:active{transform:scale(.985)}
.mod .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
.mod .ic{font-size:22px;line-height:1}
.mod .nm{font-weight:750;font-size:16.5px;margin:7px 0 3px}
.mod .ds{color:var(--muted);font-size:12.5px}
.mod .cnt{position:absolute;right:14px;top:14px;font-size:12px;color:#fff;padding:3px 9px;
  border-radius:999px;font-weight:700}
.mod .arrow{position:absolute;right:15px;bottom:13px;color:var(--muted);font-size:15px}

.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
  border:1px solid var(--line);margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:13px;padding:14px 16px;font-size:16px;font-weight:700;
  background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;transition:filter .15s ease,transform .1s ease}
.btn:active{transform:scale(.99);filter:brightness(.95)}
.btn.ghost{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:11px 14px;font-size:14.5px;border-radius:11px}
.row{display:flex;gap:10px}
.row>*{flex:1}

.qhead{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px;font-size:13px;color:var(--muted)}
.pbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 2px 16px}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#7c3aed);transition:width .3s ease;border-radius:99px}

.ask{font-size:13.5px;color:var(--muted);margin:0 2px 10px}
.stem{font-size:18px;line-height:1.8;letter-spacing:.1px}
.w{font-weight:800;color:var(--hl);background:var(--hlbg);border-radius:5px;padding:0 3px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:block;width:100%;text-align:left;cursor:pointer;background:var(--card);
  border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;font-family:inherit;
  font-size:15.5px;line-height:1.7;color:var(--fg);transition:transform .1s ease,border-color .15s ease,background .15s ease}
.opt:active{transform:scale(.995)}
.opt .k{display:inline-flex;width:22px;height:22px;margin-right:7px;border-radius:7px;background:var(--chip);
  color:var(--muted);font-size:12.5px;font-weight:800;align-items:center;justify-content:center;vertical-align:2px}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--nobg)}
.opt.wrong .k{background:var(--no);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.5}

.exp{margin-top:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:14px;
  box-shadow:var(--shadow);animation:up .22s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.exp .ttl{font-weight:800;font-size:15.5px;margin-bottom:10px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--chip);color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.kv{display:grid;grid-template-columns:78px 1fr;gap:6px 10px;font-size:14.5px}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;word-break:break-word}
.senti-积极{background:#e8f7ee;color:#15803d}
.senti-消极{background:#fdeaea;color:#b91c1c}
.senti-中性{background:#eef2ff;color:#4b5563}
@media (prefers-color-scheme:dark){
  .senti-积极{background:#12291c;color:#5fd08a}
  .senti-消极{background:#2a1616;color:#f08a8a}
  .senti-中性{background:#20242e;color:#a9b1bf}
}
.note{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.65;border-top:1px dashed var(--line);padding-top:9px}
.repl{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.7}
.repl b{color:var(--fg)}
.score{font-size:46px;font-weight:800;text-align:center;letter-spacing:-1px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;margin:6px 0 2px}
.scoreL{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:16px}
.wl{display:grid;gap:8px;margin-top:6px}
.wl .it{background:var(--bg);border-radius:11px;padding:10px 12px;font-size:14px;border:1px solid var(--line)}
.wl .it b{font-size:15px}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:22px;line-height:1.8}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#111827;color:#fff;
  padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s ease;
  z-index:99;max-width:84vw;text-align:center}
.toast.on{opacity:.94}
</style>
</head>

praiseworthy","admirable","laudable","meritorious"],"pos":"adj.","lex":"adj","family":"f_merged_adj","senti":"积极","mean":"值得称赞的","qtype":"评价类常见","sig":["admirable","commendable","laudable","meritorious","praiseworthy","值得称赞的"],"module":"attitude"},{"cat":"值得称赞的","word":"praiseworthy","repl":["praiseworthy","commendable","admirable","laudable","enviable"],"pos":"adj.","lex":"adj","family":"f_merged_adj","senti":"积极","mean":"值得赞扬的","qtype":"写作/评价类","sig":["admirable","commendable","enviable","laudable","praiseworthy","值得称赞的","值得赞扬的"],"module":"attitude"},{"cat":"值得称赞的","word":"admirable","repl":["admirable","commendable","praiseworthy","laudable","excellent"],"pos":"adj.","lex":"adj","family":"f_merged_adj","senti":"积极","mean":"令人钦佩的","qtype":"写作/评价类","sig":["admirable","commendable","excellent","laudable","praiseworthy","令人钦佩的","值得称赞的"],"module":"attitude"},{"cat":"笨重的","word":"cumbersome","repl":["cumbersome","unwieldy","heavy","awkward","ponderous","clunky"],"pos":"adj.","lex":"adj","family":"f_adj_difficult","senti":"消极","mean":"笨重的；累赘的","qtype":"物品描述类","sig":["awkward","clunky","cumbersome","heavy","ponderous","unwieldy","笨重的","笨重的;累赘的"],"module":"summary"},{"cat":"笨重的","word":"unwieldy","repl":["unwieldy","cumbersome","awkward","clumsy","ponderous","unwieldy"],"pos":"adj.","lex":"adj","family":"f_adj_difficult","senti":"消极","mean":"笨拙的；难操作的","qtype":"物品/系统描述","sig":["awkward","clumsy","cumbersome","ponderous","unwieldy","笨拙的;难操作的","笨重的"],"module":"summary"},{"cat":"连贯的","word":"coherent","repl":["coherent","logical","consistent","cohesive","clear","lucid"],"pos":"adj.","lex":"adj","family":"f_adj_similar","senti":"积极","mean":"连贯的；一致的","qtype":"文章结构类","sig":["clear","coherent","cohesive","consistent","logical","lucid","连贯的","连贯的;一致的"],"module":"matching"},{"cat":"连贯的","word":"logical","repl":["logical","coherent","coherent","rational","sound","cogent"],"pos":"adj.","lex":"adj","family":"f_merged_adj","senti":"积极","mean":"逻辑的；合理的","qtype":"写作/学术类","sig":["cogent","coherent","logical","rational","sound","连贯的","逻辑的;合理的"],"module":"attitude"},{"cat":"连贯的","word":"cogent","repl":["cogent","compelling","convincing","persuasive","irrefutable","potent"],"pos":"adj.","lex":"adj","family":"f_merged_adj","senti":"积极","mean":"有说服力的；有力的","qtype":"学术/论证类","sig":["cogent","compelling","convincing","irrefutable","persuasive","potent","有说服力的;有力的","连贯的"],"module":"attitude"},{"cat":"获得/得到","word":"obtain","repl":["obtain","acquire","gain","get","secure","procure","receive","derive"],"pos":"v.","lex":"v","family":"f_v_acquire","senti":"中性","mean":"获得；得到","qtype":"学术类高频","sig":["acquire","derive","gain","get","obtain","procure","receive","secure","得到","获得","获得;得到"],"module":"detail"},{"cat":"获得/得到","word":"acquire","repl":["acquire","obtain","gain","secure","procure","amass","attain"],"pos":"v.","lex":"v","family":"f_v_acquire","senti":"中性","mean":"获得；习得","qtype":"学术/教育类高频","sig":["acquire","amass","attain","gain","obtain","procure","secure","得到","获得","获得;习得"],"module":"detail"},{"cat":"获得/得到","word":"secure","repl":["secure","obtain","acquire","procure","gain","win"],"pos":"v.","lex":"v","family":"f_v_acquire","senti":"中性","mean":"获得；确保","qtype":"学术/正式文体","sig":["acquire","gain","obtain","procure","secure","win","得到","获得","获得;确保"],"module":"detail"}]}</script>
<script>
(function(){
"use strict";
var BANK = JSON.parse(document.getElementById('bank').textContent);
var MODS = BANK.modules, ENTRIES = BANK.entries, FRAMES = BANK.frames;
var app = document.getElementById('app');
var LS = 'ielts_syn_v3';

function load(){ try{ return JSON.parse(localStorage.getItem(LS)) || {}; }catch(e){ return {}; } }
function save(o){ try{ localStorage.setItem(LS, JSON.stringify(o)); }catch(e){} }
var store = load();
if(!store.stats) store.stats = {};
MODS.forEach(function(m){ if(!store.stats[m.key]) store.stats[m.key] = {done:0, right:0}; });

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('on'); }, 1600);
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

/* 把句式里的 {W} 替换成关键词，并高亮显示 */
function fillFrame(frame, word){
  var parts = frame.split('{W}');
  return esc(parts[0]) + '<span class="w">' + esc(word) + '</span>' + esc(parts.slice(1).join('{W}'));
}
function plainFrame(frame, word){
  return frame.split('{W}').join(word);
}

/* ---------------- 出题引擎 ----------------
   题干是一个完整句子（其中的关键词已显示）。
   四个选项也是完整句子，使用与题干【相同的句式】，只替换关键词：
   语法完全一致，唯一差别就是关键词含义 → 精确考察同义替换识别。 */
function poolOf(moduleKey){
  return ENTRIES.filter(function(e){ return e.module === moduleKey && FRAMES[e.family]; });
}
function overlaps(a, b){
  var set = {}; a.forEach(function(x){ set[x] = 1; });
  for(var i=0;i<b.length;i++){ if(set[b[i]]) return true; }
  return false;
}
function makeQuestion(entry, pool){
  var frames = FRAMES[entry.family];
  if(!frames || !frames.length) return null;
  var frame = pick(frames);

  // 题干里的关键词：一半概率显示原文词，一半概率显示它的同义替换词
  var shown = Math.random() < 0.5 ? entry.word : pick(entry.repl);
  var correct = shown;                       // 「与题干同义」的选项应当就是同一个词或其同义词
  var canonical = entry.word;                // 该词条的规范词

  // 干扰项：同族、且与本题词条不同义
  var cands = [];
  var fam = pool.filter(function(e){ return e.family === entry.family; });
  for(var i=0;i<fam.length;i++){
    var e = fam[i];
    if(e === entry) continue;
    if(overlaps(entry.sig, e.sig)) continue;
    var w = e.word;
    if(w.indexOf('/') < 0) cands.push({ word: w, entry: e });
    for(var j=0;j<e.repl.length;j++){
      if(e.repl[j].indexOf('/') < 0) cands.push({ word: e.repl[j], entry: e });
    }
  }
  shuffle(cands);
  var seen = {}; seen[shown.toLowerCase()] = 1;
  var distractors = [];
  for(var k=0;k<cands.length && distractors.length<3;k++){
    var key = cands[k].word.toLowerCase();
    if(seen[key]) continue;
    seen[key] = 1; distractors.push(cands[k]);
  }
  if(distractors.length < 3) return null;

  var opts = distractors.slice(0,3).map(function(c){
    return { text: c.word, sentence: plainFrame(frame, c.word), entry: c.entry, ok: false };
  });
  opts.push({ text: shown, sentence: plainFrame(frame, shown), entry: entry, ok: true });
  var answerIndex = opts.length - 1;
  shuffle(opts);
  for(var m=0;m<opts.length;m++){ if(opts[m].ok) answerIndex = m; }

  return {
    frame: frame, shown: shown, canonical: canonical,
    stem: plainFrame(frame, shown), options: opts, answerIndex: answerIndex,
    entry: entry, isRepl: shown !== entry.word
  };
}

/* ---------------- 首页 ---------------- */
function home(){
  var h = '';
  h += '<div class="top"><div class="brand"><span class="logo">Aa</span><span>雅思同义替换闯关</span></div></div>';
  h += '<p class="sub">四个题型模块 · ' + ENTRIES.length + ' 组同义替换 · 离线可用</p>';
  h += '<div class="mods">';
  MODS.forEach(function(m){
    var st = store.stats[m.key];
    var acc = st.done ? Math.round(st.right / st.done * 100) : 0;
    h += '<div class="mod" data-mod="' + m.key + '">'
       +   '<div class="bar" style="background:' + m.color + '"></div>'
       +   '<div class="cnt" style="background:' + m.color + '">' + poolOf(m.key).length + ' 组</div>'
       +   '<div class="ic">' + m.icon + '</div>'
       +   '<div class="nm">' + esc(m.name) + '</div>'
       +   '<div class="ds">' + esc(m.desc) + '</div>'
       +   '<div class="ds" style="margin-top:5px">已练 ' + st.done + ' 题 · 正确率 ' + acc + '%</div>'
       +   '<div class="arrow">进入 ›</div>'
       + '</div>';
  });
  h += '</div>';
  h += '<div class="card" style="margin-top:16px"><div class="row">'
     +   '<button class="btn ghost sm" id="btn-random">🎲 随机混合</button>'
     +   '<button class="btn ghost sm" id="btn-reset">🧹 清空进度</button>'
     + '</div></div>';
  h += '<div class="foot">题目：题干一个完整句子 → 四个句子选出同义替换<br>'
     + '数据源：雅思同义替换总表（' + ENTRIES.length + ' 组）</div>';
  app.innerHTML = h;

  Array.prototype.forEach.call(app.querySelectorAll('.mod'), function(el){
    el.addEventListener('click', function(){ start(el.getAttribute('data-mod')); });
  });
  document.getElementById('btn-random').addEventListener('click', function(){ start(pick(MODS).key); });
  document.getElementById('btn-reset').addEventListener('click', function(){
    if(confirm('清空全部练习记录？')){
      store = {stats:{}};
      MODS.forEach(function(m){ store.stats[m.key] = {done:0, right:0}; });
      save(store); toast('已清空'); home();
    }
  });
}

/* ---------------- 答题 ---------------- */
var S = null;

function start(moduleKey){
  var pool = poolOf(moduleKey);
  if(!pool.length){ toast('该模块暂无可用题目'); return; }
  S = {
    mod: MODS.filter(function(m){ return m.key === moduleKey; })[0],
    pool: pool, queue: shuffle(pool.slice()), total: 12, idx: 0, right: 0,
    wrong: [], q: null, answered: false
  };
  nextQuestion();
}
function nextQuestion(){
  if(S.idx >= S.total) return result();
  if(!S.queue.length) S.queue = shuffle(S.pool.slice());
  var q = null, guard = 0;
  while(!q && guard++ < 120){ q = makeQuestion(S.queue.shift(), S.pool); }
  if(!q) return result();
  S.q = q; S.answered = false; S.idx++;
  drawQuestion();
}
function drawQuestion(){
  var m = S.mod, q = S.q;
  var h = '';
  h += '<div class="top">'
     +   '<div class="brand"><span class="logo" style="background:' + m.color + '">' + m.icon + '</span>'
     +   '<span style="font-size:16.5px">' + esc(m.name) + '</span></div>'
     +   '<button class="btn ghost sm" id="btn-quit" style="width:auto;padding:8px 12px">退出</button>'
     + '</div>';
  h += '<div class="qhead"><span>第 ' + S.idx + ' / ' + S.total + ' 题</span>'
     +   '<span>✅ ' + S.right + ' · ❌ ' + S.wrong.length + '</span></div>';
  h += '<div class="pbar"><i style="width:' + Math.round((S.idx-1)/S.total*100) + '%"></i></div>';
  h += '<div class="ask">读下面这句话，选出与它意思相同的句子：</div>';
  h += '<div class="card"><div class="stem">' + fillFrame(q.frame, q.shown) + '</div></div>';
  h += '<div class="opts" id="opts"></div><div id="exp"></div>';
  app.innerHTML = h;
  document.getElementById('btn-quit').addEventListener('click', function(){
    if(confirm('退出本轮练习？')) { S = null; home(); }
  });

  var optsEl = document.getElementById('opts');
  var letters = ['A','B','C','D'];
  q.options.forEach(function(o, i){
    var b = document.createElement('button');
    b.className = 'opt'; b.type = 'button';
    b.innerHTML = '<span class="k">' + letters[i] + '</span>' + fillFrame(q.frame, o.text);
    b.addEventListener('click', function(){ choose(i); });
    optsEl.appendChild(b);
  });
}
function choose(i){
  if(S.answered) return;
  S.answered = true;
  var q = S.q, m = S.mod;
  var btns = document.querySelectorAll('#opts .opt');
  var ok = (i === q.answerIndex);

  Array.prototype.forEach.call(btns, function(b, j){
    b.setAttribute('disabled','disabled');
    if(j === q.answerIndex) b.classList.add('right');
    else if(j === i) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  var st = store.stats[m.key];
  st.done++;
  if(ok){ st.right++; S.right++; }
  else { S.wrong.push({ word: q.entry.word, mean: q.entry.mean, correct: q.shown }); }
  save(store);

  var e = q.entry, senti = e.senti || '中性';
  var ex = '<div class="exp">'
    + '<div class="ttl">' + (ok ? '✅ 正确' : '❌ 正确答案：' + esc(q.shown)) + '</div>'
    + '<div class="tags">'
    +   '<span class="tag">' + esc(e.cat) + '</span>'
    +   '<span class="tag">' + esc(e.pos) + '</span>'
    +   '<span class="tag senti-' + esc(senti) + '">感情色彩：' + esc(senti) + '</span>'
    +   (q.isRepl ? '<span class="tag" style="background:#dcfce7;color:#15803d">同义替换</span>' : '')
    + '</div>'
    + '<div class="kv">'
    +   '<div class="k">中文释义</div><div class="v">' + esc(e.mean) + '</div>'
    +   '<div class="k">词　性</div><div class="v">' + esc(e.pos) + '</div>'
    +   '<div class="k">感情色彩</div><div class="v">' + esc(senti) + '</div>'
    +   '<div class="k">题干关键词</div><div class="v">' + esc(q.shown) + '</div>'
    +   '<div class="k">原文/常见</div><div class="v">' + esc(e.word) + '</div>'
    + '</div>'
    + '<div class="repl"><b>同义替换词：</b>' + esc(e.repl.join(' / ')) + '</div>'
    + (e.qtype ? '<div class="note">📌 常见题型：' + esc(e.qtype) + '</div>' : '')
    + '<button class="btn" style="margin-top:13px" id="btn-next">'
    +   (S.idx >= S.total ? '查看结果 →' : '下一题 →') + '</button>'
    + '</div>';
  document.getElementById('exp').innerHTML = ex;
  document.getElementById('btn-next').addEventListener('click', nextQuestion);
  document.getElementById('exp').scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ---------------- 结果 ---------------- */
function result(){
  var total = S.idx, right = S.right, acc = total ? Math.round(right/total*100) : 0;
  var h = '';
  h += '<div class="top"><div class="brand"><span class="logo">🏁</span><span>本轮结束</span></div></div>';
  h += '<div class="card"><div class="score">' + acc + '%</div>'
     + '<div class="scoreL">共 ' + total + ' 题 · 答对 ' + right + ' · 答错 ' + (total-right) + '</div>';
  if(S.wrong.length){
    h += '<div style="font-weight:750;font-size:15px">错题回顾</div><div class="wl">';
    S.wrong.forEach(function(w){
      h += '<div class="it"><b>' + esc(w.word) + '</b> → ' + esc(w.correct)
         + '<div style="color:var(--muted);font-size:13px;margin-top:3px">' + esc(w.mean) + '</div></div>';
    });
    h += '</div>';
  } else {
    h += '<div style="text-align:center;color:var(--ok);font-weight:700">全部正确，漂亮！</div>';
  }
  h += '</div><div class="row"><button class="btn" id="btn-again">再来一轮</button>'
     + '<button class="btn ghost" id="btn-home">返回首页</button></div>';
  app.innerHTML = h;
  document.getElementById('btn-again').addEventListener('click', function(){ start(S.mod.key); });
  document.getElementById('btn-home').addEventListener('click', function(){ S = null; home(); });
}

/* ---------------- 启动 ---------------- */
home();
try{ window.__t = { makeQuestion: makeQuestion, poolOf: poolOf, ENTRIES: ENTRIES,
                    FRAMES: FRAMES, MODS: MODS, fillFrame: fillFrame }; }catch(e){}
/* PWA：用 http(s) 打开时注册离线缓存；用文件方式打开时静默跳过 */
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
})();
</script>
